<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="60%" stop-color="#0c0d14" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Shield Border Holographic Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Core Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#1a2a6c" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#2c003e" />
    </linearGradient>

    <!-- Accent Energy Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Deep Contrast -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Grid Tech Overlay Pattern -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1.5">
    <path d="M 0 128 H 512 M 0 256 H 512 M 0 384 H 512" />
    <path d="M 128 0 V 512 M 256 0 V 512 M 384 0 V 512" />
    <!-- Diagonal subtle cyber mesh -->
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 12" />
    <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(112,0,255,0.4)" stroke-width="1" />
  </g>

  <!-- Futuristic Outer Cyber Shield -->
  <path d="M 256 54 
           L 412 110 
           L 412 268 
           Q 412 388 256 458 
           Q 100 388 100 268 
           L 100 110 Z" 
        fill="rgba(16, 20, 36, 0.65)" 
        stroke="url(#shieldBorder)" 
        stroke-width="5" 
        filter="url(#subtleShadow)" />

  <!-- Shield Circuit Insets -->
  <path d="M 256 78 
           L 388 126 
           L 388 260 
           Q 388 360 256 426 
           Q 124 360 124 260 
           L 124 126 Z" 
        fill="none" 
        stroke="rgba(0, 242, 254, 0.25)" 
        stroke-width="1.5" 
        stroke-dasharray="14 8" />

  <!-- Central Isometric MCP Protocol Quantum Cube -->
  <g transform="translate(256, 240)">
    <!-- Top Face -->
    <polygon points="0,-76 72,-34 0,8 -72,-34" 
             fill="url(#cubeTop)" 
             opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-72,-34 0,8 0,92 -72,50" 
             fill="url(#cubeLeft)" 
             opacity="0.9" />
    <!-- Right Face -->
    <polygon points="0,8 72,-34 72,50 0,92" 
             fill="url(#cubeRight)" 
             opacity="0.9" />

    <!-- Isometric Circuit Seams & Inner Glow -->
    <path d="M 0,-76 L 0,8 M -72,-34 L 0,8 L 72,-34 M 0,8 L 0,92" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.45" />

    <!-- Core MCP Cross / Gateway Node -->
    <circle cx="0" cy="8" r="9" fill="#00f2fe" filter="url(#neonGlow)" />

    <!-- Protocol Connection Nodes / Orbital Pulses -->
    <g stroke="#00f2fe" stroke-width="2.5" fill="#0c0d14">
      <!-- Database Connection Line (Left) -->
      <path d="M -72,50 L -115,75 L -115,110" fill="none" opacity="0.8" />
      <circle cx="-115" cy="110" r="6" fill="#38ef7d" filter="url(#neonGlow)" />

      <!-- Cloud/K8s Node Connection Line (Right) -->
      <path d="M 72,50 L 115,75 L 115,110" fill="none" opacity="0.8" />
      <circle cx="115" cy="110" r="6" fill="#7000ff" filter="url(#neonGlow)" />

      <!-- North Agent Intelligence Uplink (Top) -->
      <path d="M 0,-76 L 0,-120" fill="none" opacity="0.8" stroke-dasharray="4 4" />
      <polygon points="0,-132 -6,-120 6,-120" fill="#00f2fe" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- Elegant Tech Monogram Badge "MCP" at Lower Shield -->
  <g transform="translate(256, 396)">
    <rect x="-56" y="-18" width="112" height="32" rx="16" 
          fill="rgba(5, 6, 8, 0.85)" 
          stroke="url(#shieldBorder)" 
          stroke-width="1.5" />
    <text x="0" y="5" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#ffffff">NEXTGEN</text>
  </g>
</svg>
