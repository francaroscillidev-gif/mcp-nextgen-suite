apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-nextgen-suite
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-nextgen-suite
    app.kubernetes.io/part-of: mcp-agent-infrastructure
    app.kubernetes.io/managed-by: franca-roscilli
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-nextgen-suite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-nextgen-suite
    spec:
      serviceAccountName: mcp-nextgen-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: ghcr.io/francaroscillidev-gif/mcp-nextgen-suite:latest
          imagePullPolicy: IfNotPresent
          args: ["--sse"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: MCP_PORT
              value: "3000"
          ports:
            - name: sse-http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-nextgen-service
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-nextgen-suite
spec:
  type: ClusterIP
  ports:
    - name: http-sse
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: mcp-nextgen-suite
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-nextgen-sa
  namespace: mcp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-nextgen-read-only-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-nextgen-read-only-binding
subjects:
  - kind: ServiceAccount
    name: mcp-nextgen-sa
    namespace: mcp-system
roleRef:
  kind: ClusterRole
  name: mcp-nextgen-read-only-role
  apiGroup: rbac.authorization.k8s.io
